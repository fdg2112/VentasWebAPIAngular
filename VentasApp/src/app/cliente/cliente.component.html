<div class="container">
    <h2>Clientes</h2>
    <div>
        <button mat-raised-button color="primary" (click)='openDialogAddCliente()'>Agregar Cliente</button>
    </div>
    <div>
        <table mat-table [dataSource]="list" class="mat-elevation-z8">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let cliente"> {{cliente.id}} </td>
            </ng-container>

            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let cliente"> {{cliente.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let cliente">
                    <div class="acciones">
                      <button mat-icon-button color="primary" (click)="openDialogEditCliente(cliente)">
                        <mat-icon>edit</mat-icon>
                      </button>
                      <button mat-icon-button color="warn" (click)="deleteCliente(cliente)">
                        <mat-icon>delete</mat-icon>
                      </button>
                    </div>
                  </td>                  
              </ng-container>
              

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
